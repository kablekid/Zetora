<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline · Zetora</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7fb;color:#141824;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:24px;text-align:center}
    .card{max-width:420px;background:#fff;border:1px solid #e3e6ef;border-radius:20px;padding:32px}
    h1{font-size:22px;margin:16px 0 8px}p{color:#5a6177;line-height:1.6;margin:0 0 20px}
    button{background:#4338ca;color:#fff;border:0;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer}
    .mark{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:24px}
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">Z</div>
    <h1>You're offline</h1>
    <p>Zetora needs an internet connection to load your lessons. Check your connection and try again — your progress is saved.</p>
    <h1 lang="am" style="margin-top:28px">ከመስመር ውጭ ነዎት</h1>
    <p lang="am">Zetora ትምህርቶችዎን ለመጫን የበይነመረብ ግንኙነት ይፈልጋል። ግንኙነትዎን ይፈትሹና እንደገና ይሞክሩ — እድገትዎ ተቀምጧል።</p>
    <button onclick="location.reload()">Try again · እንደገና ሞክር</button>
  </div>
</body>
</html>
